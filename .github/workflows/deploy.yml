name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Atomisk deploy: varje release får en egen mapp och symlänken
      # /srv/bravas/current byts i en enda operation — inga trasiga
      # mellanlägen för besökare mitt i en deploy. Nginx-root ska peka
      # på /srv/bravas/current (se TODO.md).
      - name: Deploy release and switch symlink
        run: |
          rel="/srv/bravas/releases/$(date +%Y%m%d%H%M%S)-$(git rev-parse --short HEAD)"
          mkdir -p "$rel"
          cp -r dist/. "$rel/"
          ln -sfn "$rel" /srv/bravas/current

      - name: Prune old releases (keep 5)
        run: ls -dt /srv/bravas/releases/* | tail -n +6 | xargs -r rm -rf
