version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    # Vänta 3 dagar efter release innan uppdateringen föreslås —
    # skydd mot färska supply chain-attacker som upptäcks inom dagar.
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # API:et har en egen package.json och en egen package-lock.json, och stod
  # utanför bevakningen helt: Express, better-sqlite3 och csrf-csrf har aldrig
  # fått en enda uppdatering föreslagen. Det är den halva av repot som faktiskt
  # tar emot trafik från internet.
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
