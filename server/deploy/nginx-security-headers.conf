# Läggs till i server-blocket i /etc/nginx/sites-available/bravas, utanför
# alla location-block så headrarna gäller hela sajten (statiska filer och
# /api/ båda).
#
# Draft — applicerad för hand, precis som de andra filerna i den här mappen,
# men INTE verifierad mot skarp drift. Kontrollera efter påslag:
#   - Avatarer (Steam-CDN) laddar fortfarande — CSP:ns img-src listar de två
#     domänmönster Steam historiskt använt (avatars.steamstatic.com och den
#     äldre akamai.steamstatic.com-varianten). Har Steam bytt CDN sedan dess
#     behöver listan uppdateras.
#   - Inga nya fel i webbläsarens konsol på /, /manager och /mitt-konto —
#     React skriver ut inline style="--pct:80%" på flera ställen (attributraden,
#     spelarkorten), därför style-src 'unsafe-inline'. Ingen inline <script>
#     används, så script-src klarar sig utan.
#   - Klippen spelar. frame-src listar de tre tjänster galleriet bäddar in
#     (se server/src/clipUrl.ts) — utan den raden faller de på default-src
#     'self' och rutan blir tom när någon trycker på spela. Lägger ni till en
#     leverantör i clipUrl.ts måste den läggas till här också, annars fungerar
#     den lokalt och inte i drift.
#   - curl -sI https://www.bravas.se/ ska visa alla raderna nedan.
#
# HSTS: sajten går via en Cloudflare-tunnel, som redan kan tvinga HTTPS på
# sin sida ("Always Use HTTPS"/HSTS i Cloudflares dashboard) — kolla det
# innan den här raden dubbelsätts.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://avatars.steamstatic.com https://avatars.akamai.steamstatic.com; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://clips.twitch.tv https://player.twitch.tv https://medal.tv; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
