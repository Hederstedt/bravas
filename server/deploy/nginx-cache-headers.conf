# Läggs till i location /-blocket i /etc/nginx/sites-available/bravas, efter
# try_files (se nginx-spa-location.conf).
#
# Vite hashar filnamnet på varje JS/CSS-fil den bygger (index-CyQgzuq4.js) —
# innehållet ändras aldrig utan att namnet också gör det. De filerna kan
# alltså cachas för evigt. index.html, manifestet, sitemap.xml och robots.txt
# har inget hashat namn: en ny deploy måste synas i dem direkt, så de får en
# kort cache i stället — annars kan en besökare sitta fast på gårdagens
# index.html som pekar på JS-filer som redan städats bort av nästa deploy.
#
# Draft — applicerad för hand, precis som de andra filerna i den här mappen,
# men inte verifierad mot skarp drift. Kontrollera efter påslag:
#   curl -sI https://www.bravas.se/assets/<en-hashad-fil>.js  → Cache-Control
#   curl -sI https://www.bravas.se/                            → Cache-Control
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location = /index.html {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}

location ~ ^/(manifest\.webmanifest|sitemap\.xml|robots\.txt)$ {
    add_header Cache-Control "public, max-age=300" always;
}
