# Ersätter location / i server-blocket i /etc/nginx/sites-available/bravas.
# Appliceras för hand på servern, precis som API-snutten.
#
# Sajten är en SPA med riktiga adresser (/manager, /manager/match/1). En
# direktladdning av en sådan adress träffar nginx, inte routern — utan
# try_files svarar nginx 404 på varje delad länk, trots att allt är grönt i CI
# (Vites preview-server har samma fallback inbyggd, så E2E märker inget).
# try_files låter varje okänd väg falla tillbaka till index.html, där routern
# tar över. Riktiga filer (JS, CSS, bilder) serveras precis som förut.
location / {
    try_files $uri $uri/ /index.html;
}
