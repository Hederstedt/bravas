# Läggs till i server-blocket i /etc/nginx/sites-available/bravas, ovanför location /.
#
# Trafiken kommer via Cloudflare-tunneln, så nginx ser alltid 127.0.0.1 som
# remote_addr. Besökarens riktiga IP ligger i CF-Connecting-IP och måste
# vidarebefordras — annars hamnar alla besökare i samma rate-limit-hink.

# Händelseströmmen måste stå före location /api/ — nginx väljer det längsta
# matchande prefixet, så det här blocket vinner för just /api/events.
#
# En SSE-respons tar aldrig slut, och standardinställningarna är gjorda för
# svar som gör det:
#   - proxy_pass talar HTTP/1.0 om man inte säger annat, vilket omöjliggör en
#     strömmande respons. Connection måste tömmas för att 1.1 ska hålla i sig.
#   - proxy_buffering samlar upp svaret tills det är färdigt. Det blir det
#     aldrig här, så utan detta ser besökaren ingenting alls. API:et skickar
#     även X-Accel-Buffering: no, men den här raden gör det oberoende av att
#     headern överlever hela vägen.
#   - proxy_read_timeout stänger annars strömmen efter 60 sekunder. Hjärtslaget
#     går var 25:e så det hade räckt, men marginalen kostar ingenting.
location /api/events {
    proxy_pass http://127.0.0.1:3001/api/events;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
}
