# Läggs till i server-blocket i /etc/nginx/sites-available/bravas, ovanför location /.
#
# Trafiken kommer via Cloudflare-tunneln, så nginx ser alltid 127.0.0.1 som
# remote_addr. Besökarens riktiga IP ligger i CF-Connecting-IP och måste
# vidarebefordras — annars hamnar alla besökare i samma rate-limit-hink.
location /api/ {
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
}
